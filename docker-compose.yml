services:
  postgres:
    image: postgres:16-alpine
    container_name: lancarme-postgres
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: lancarme
      POSTGRES_USER: lancarme_local
      POSTGRES_PASSWORD: changeme_local_only
    volumes:
      - lancarme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lancarme_local -d lancarme"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  lancarme_postgres_data:
